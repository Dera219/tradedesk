[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradedesk"
version = "0.1.0"
description = "Conversational paper-trading assistant — AI.Accelerate FY26 capstone"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2.45",
    "langchain-core>=0.3",
    "anthropic>=0.70",
    "chromadb>=0.5",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
]
mcp = ["mcp>=1.1"]
#: `GraphAgent.draw()` only. Not needed to run the agent — it renders the ASCII graph diagram
#: for the DSN slide. `GraphAgent.edges()` gives the same wiring with no extra dependency.
viz = ["grandalf>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
# S101: pytest needs bare asserts.
per-file-ignores = { "tests/**" = ["S101"] }

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
